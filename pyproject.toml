[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-speech"
version = "1.0.0"
description = "Internal Aurora microservice for pt-BR speech synthesis using Kokoro TTS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aurora Platform" }]
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    # The synthesis engine. This service exists to run it; it is not optional.
    "kokoro>=0.9.2",
    "torch>=2.2.0",
    "sentry-sdk[fastapi]>=2.72.0",
]

[dependency-groups]
# Development tooling. Installed by default with `uv sync`, excluded from the
# Docker image via `uv sync --no-dev`.
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "RUF"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["soundfile", "kokoro", "kokoro.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
