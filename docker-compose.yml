services:
  aurora-speech:
    build: .
    image: aurora-speech:latest
    container_name: aurora-speech
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Aurora Speech
      APP_VERSION: 1.0.0
      CACHE_DIR: /app/cache
      ENGINE_NAME: kokoro-82m-v2
      DEFAULT_VOICE: teacher_female_v1
    volumes:
      # ARCHITECTURAL DECISION - DO NOT CHANGE WITHOUT UPDATING docs/deployment.md
      # The homelab keeps every service's persistent data under /storage.
      # aurora-speech owns /storage/aurora-speech/cache and mounts it at /app/cache.
      # For a throwaway local run without /storage, swap the line below for:
      #   - ./cache:/app/cache
      - /storage/aurora-speech/cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
